# Cross River State Blue ID — self-hosted stack.
#
# Everything the register needs runs on one Nigerian server: the API, the
# PostgreSQL database that holds the citizen data, and the volume that holds
# the photographs. Nothing leaves the country, which is what NITDA's National
# Cloud Policy requires of identity data.
#
#   cp deploy/.env.production.example deploy/.env && edit it
#   docker compose -f deploy/docker-compose.yml up -d
#
# The database port is deliberately NOT published. Postgres is reachable only
# from the api container over the compose network, so the only way in from
# outside is an SSH tunnel by someone with a key on the box.

name: blueid

services:
  postgres:
    # postgis/postgis bundles PostGIS with Postgres, so the GIS requirement in
    # §8 of the concept note needs no extra install step on the server.
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blueid}
      POSTGRES_USER: ${POSTGRES_USER:-blueid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Checksums catch silent disk corruption. For a register that cannot be
      # re-collected, finding out early is worth the few percent of overhead.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Nightly dumps land here for the off-box backup job to collect.
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blueid} -d ${POSTGRES_DB:-blueid}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Tuned for a 8GB / 4 vCPU VPS. Raise shared_buffers to ~25% of RAM and
    # effective_cache_size to ~60% if the box is larger.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=100
      # Write-ahead log kept long enough to recover to a point in time
      # between nightly dumps.
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=2GB
      # Log anything slow enough to be worth looking at.
      - -c
      - log_min_duration_statement=500
      - -c
      - log_checkpoints=on
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      # Over the compose network, not the public internet, so TLS to the
      # database buys nothing here. config/index.js allows this only because
      # the host is internal.
      DATABASE_URL: postgres://${POSTGRES_USER:-blueid}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blueid}
      MEDIA_DRIVER: local
      MEDIA_ROOT: /var/lib/blueid/media
      # The cache, rate limiter and sync lock are per-process; more than one
      # instance would break the lock that stops a sync batch being processed
      # twice. The app refuses to start if this is raised.
      WEB_CONCURRENCY: 1
    volumes:
      # The photographs. A named volume, so a `docker compose down` cannot
      # take them with it.
      - media:/var/lib/blueid/media
    ports:
      # Bound to loopback: nginx on the host terminates TLS and proxies in.
      - "127.0.0.1:${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [internal]

  # Runs the schema migrations once, then exits. Separated from the API so a
  # restart of the API never re-runs DDL, and so a failed migration is a
  # visible failed container rather than a crash loop.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-blueid}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blueid}
    command: ["node", "src/scripts/migrate.js"]
    networks: [internal]

  # Nightly dump into the backup volume. The dump is only half a backup —
  # something off this machine must collect it. See OPERATIONS.md.
  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          STAMP=$$(date -u +%Y%m%dT%H%M%SZ)
          echo "[backup] starting $$STAMP"
          pg_dump -h postgres -U ${POSTGRES_USER:-blueid} -d ${POSTGRES_DB:-blueid} \
            --format=custom --compress=6 \
            --file=/backups/blueid-$$STAMP.dump && \
            echo "[backup] wrote blueid-$$STAMP.dump" || echo "[backup] FAILED"
          # Keep 14 locally; the off-box copy is the real retention.
          ls -1t /backups/blueid-*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
          sleep 86400
        done
    networks: [internal]

volumes:
  pgdata:
    driver: local
  media:
    driver: local

networks:
  internal:
    driver: bridge
